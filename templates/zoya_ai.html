<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zoya AI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { font-family: 'Poppins', sans-serif; background: #09090b; color: white; height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center; position: relative; }
        
        /* Header */
        .header { width: 100%; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; font-size: 16px; font-weight: 600; z-index: 10; background: #09090b; }
        .menu-icon, .profile-icon { font-size: 20px; color: #aaa; cursor: pointer; }
        .app-name { display: flex; align-items: center; gap: 5px; }
        .app-name span { color: #ff69b4; font-size: 20px; }

        /* Zoya Image */
        .image-container { width: 100%; display: flex; justify-content: center; margin-top: 10px; }
        .zoya-image { width: 180px; height: 180px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255, 255, 255, 0.1); box-shadow: 0 0 30px rgba(255, 105, 180, 0.3); transition: all 0.4s ease; }

        /* Chat Messages Area */
        .chat-area { flex: 1; width: 100%; padding: 20px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; scrollbar-width: none; margin-bottom: 80px; }
        .chat-area::-webkit-scrollbar { display: none; }
        
        .msg { padding: 12px 18px; border-radius: 20px; font-size: 14px; max-width: 85%; line-height: 1.5; box-shadow: 0 4px 15px rgba(0,0,0,0.2); animation: popIn 0.3s ease; }
        @keyframes popIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .msg.user { background: linear-gradient(135deg, #ff69b4, #8a2be2); align-self: flex-end; border-bottom-right-radius: 4px; color: white; }
        .msg.zoya { background: rgba(40, 40, 50, 0.9); align-self: flex-start; border-bottom-left-radius: 4px; color: #eee; border: 1px solid rgba(255,255,255,0.05); }

        /* Typing Indicator */
        .typing { display: flex; gap: 5px; padding: 15px 20px; align-items: center; }
        .dot { width: 8px; height: 8px; background: #ff69b4; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        /* Input Box */
        .input-container {
            position: absolute; bottom: 80px; width: 92%; max-width: 400px;
            display: flex; align-items: center; background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px); border: 1px solid rgba(255, 105, 180, 0.3);
            border-radius: 40px; padding: 8px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            z-index: 20;
        }

        .input-container input { flex: 1; background: transparent; border: none; color: white; font-size: 15px; outline: none; padding: 0 15px; font-family: 'Poppins', sans-serif; }
        .input-container input::placeholder { color: #888; }

        /* Perfectly Sized Buttons */
        .btn { width: 48px; height: 48px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; cursor: pointer; transition: 0.3s; margin-left: 8px; flex-shrink: 0; }
        
        .send-btn { background: linear-gradient(135deg, #ff69b4, #8a2be2); color: white; box-shadow: 0 0 15px rgba(255, 105, 180, 0.4); border: none; }
        .send-btn:active { transform: scale(0.9); }

        .mic-btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255,105,180,0.3); color: #ff69b4; }
        .mic-btn.recording { background: #ff3366; color: white; box-shadow: 0 0 20px #ff3366; animation: pulseMic 1s infinite; }
        @keyframes pulseMic { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <div class="header">
        <div class="menu-icon">☰</div>
        <div class="app-name"><span>✦</span> Zoya</div>
        <div class="profile-icon">👤</div>
    </div>

    <div class="image-container">
        <img src="/static/anime.jpg" alt="Zoya" class="zoya-image" id="zoyaImg">
    </div>

    <div class="chat-area" id="messages"></div>

    <div class="input-container">
        <input type="text" id="msgInput" placeholder="Ask Zoya anything...">
        <button class="btn send-btn" id="sendBtn" onclick="sendTextMessage()">➤</button>
        <div class="btn mic-btn" id="micBtn">🎙️</div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        const messages = document.getElementById('messages');
        const input = document.getElementById('msgInput');
        const audioPlayer = document.getElementById('audioPlayer');
        const micBtn = document.getElementById('micBtn');
        const zoyaImg = document.getElementById('zoyaImg');
        
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'hi-IN';
        recognition.continuous = true; 
        
        let isListening = false;
        let isProcessing = false;

        micBtn.addEventListener('click', () => {
            if (!isListening) {
                try { recognition.start(); } catch(e) {}
                isListening = true;
                micBtn.classList.add('recording');
                micBtn.innerText = "⏹️"; 
                zoyaImg.style.opacity = "0.3";
            } else {
                recognition.stop();
                isListening = false;
                micBtn.classList.remove('recording');
                micBtn.innerText = "🎙️";
                zoyaImg.style.opacity = "1";
            }
        });

        recognition.onresult = (event) => {
            if (isProcessing) return;
            const text = event.results[event.results.length - 1][0].transcript.trim();
            if (text) sendMessage(text);
        };

        function sendTextMessage() {
            const text = input.value.trim();
            if (text) sendMessage(text);
        }

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendTextMessage();
        });

        async function sendMessage(text) {
            if (!text || isProcessing) return;
            input.value = '';
            addMessage(text, 'user');
            
            // Typing Indicator
            const typingId = 'typing-' + Date.now();
            const typingDiv = document.createElement('div');
            typingDiv.className = 'msg zoya typing';
            typingDiv.id = typingId;
            typingDiv.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
            messages.appendChild(typingDiv);
            messages.scrollTop = messages.scrollHeight;
            
            isProcessing = true; 

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: text})
                });
                const data = await response.json();
                document.getElementById(typingId).remove();
                addMessage(data.reply, 'zoya');

                if(data.audio_url) {
                    audioPlayer.src = data.audio_url;
                    audioPlayer.play();
                    audioPlayer.onended = () => { isProcessing = false; };
                } else {
                    isProcessing = false;
                }
            } catch (error) {
                document.getElementById(typingId).remove();
                addMessage("Connection error.", 'zoya');
                isProcessing = false;
            }
        }

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            div.textContent = text;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }
    </script>
</body>
</html>
